services:
  - type: web
    name: bankanalyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Schema is applied as a release step, never at app startup.
    preDeployCommand: flask db upgrade
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile - wsgi:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: FLASK_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bankanalyzer-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_FOLDER
        value: /tmp/bankanalyzer-uploads
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: JWT_ACCESS_TTL_MINUTES
        value: "30"
      - key: JWT_REFRESH_TTL_DAYS
        value: "14"
      - key: FLASK_APP
        value: wsgi.py

databases:
  - name: bankanalyzer-db
    plan: free
    databaseName: bankanalyzer
    user: bankanalyzer
